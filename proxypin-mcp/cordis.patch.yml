# ProxyPin MCP 桥：一个只有配置、没有 Host / Client 入口文件的 bundle。
# 它插入的是已安装好的 MCP 客户端行，把 ProxyPin 的工具以
# mcp__proxypin__<tool> 的形式暴露给模型。
#
# 想连上，得先让 ProxyPin Desktop 跑起来并开启它的 MCP 服务
# （默认 http://127.0.0.1:9127/mcp）。如果 9127 端口已被占用，ProxyPin 会
# 随机换一个端口——去它的设置面板读真实 URL，再改下面的 `url`。
#
# 配置都落在这一行的 `config` 下，插件升级后依然保留（升级不动 profile 里的这一行）。
#
# failOnStartupError: true 跟宿主模板保持一致：这行配置坏了就在启动时报错，
# 而不是静默消失。如果 ProxyPin 不是常驻运行、并且你能接受「下次重启 DSH 前
# 工具暂缺」，把它改成 false。
- insert:
    - id: proxypin-mcp
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: proxypin
        transport: streamable-http
        url: http://127.0.0.1:9127/mcp
        failOnStartupError: true
